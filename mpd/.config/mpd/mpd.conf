music_directory     "~/03-media/03-music/"
playlist_directory  "~/03-media/03-music/playlists/"
db_file            "~/.mpd/database"
log_file           "~/.mpd/log"
pid_file           "~/.mpd/pid"
state_file         "~/.mpd/state"
sticker_file       "~/.mpd/sticker.sql"
user              "gaitano"

auto_update         "yes"
bind_to_address    "127.0.0.1" # localhost
port               "6600"
restore_paused 		"yes"
max_output_buffer_size "2048" # in KB

audio_output {
	type 	  "pipewire"
	name 	  "Pipewire Output"	
}

decoder {
    plugin "wildmidi"
    config_file "/etc/wildmidi/wildmidi.cfg"
}

