[colors]
;background = #091717
;background-alt = #484B4B
;foreground = #E8DDB5
;primary = #008285
;secondary = #8ABEB7
;alert = #A54242
disabled = #707880

background = ${xrdb:color0:#222}
background-alt = ${xrdb:color0:#222}
foreground = ${xrdb:color7:#222}
foreground-alt = ${xrdb:color7:#222}
primary = ${xrdb:color1:#222}
secondary = ${xrdb:color2:#222}
alert = ${xrdb:color3:#222}


[bar/main]
width = 100%
height = 24pt

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

;border-size = 0
;border-color = #00

padding-left = 3
padding-right = 3

module-margin = 1

;separator = |
;separator-foreground = ${colors.disabled}

font-0 = CaskaydiaCoveNerdFont-Light Font:size=10;1

modules-left = power battery xworkspaces spotify
modules-center = timeDateWeather
modules-right = cpu pulseaudio backlight wireless-network
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3

override-redirect = false


[module/power]
type = custom/menu
expand-right = true

label-open = 
label-open-padding = 1
label-close = 
label-close-padding = 1
label-separator = " | "

menu-0-0 = ⏻ Shutdown
menu-0-0-exec = systemctl poweroff

menu-0-1 =  Reboot
menu-0-1-exec = systemctl reboot

menu-0-2 =  Sleep
menu-0-2-exec = systemctl suspend


[module/battery]
type = internal/battery
interval = 10

battery = BAT0
adapter = ADP1

full-at = 99
low-at = 20

time-format = %H:%M

format-charging = <label-charging> <animation-charging>
format-discharging = <label-discharging> <ramp-capacity>
format-full = <label-full> <ramp-capacity>
format-full-foreground = ${colors.primary}
format-low = <label-low> <animation-low>
format-low-foreground = ${colors.alert}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = Fully charged
label-low = BATTERY LOW %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

animation-low-0 = !
animation-low-1 = 
animation-low-framerate = 200


[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-foreground = ${colors.primary}
label-active-background = ${colors.background-alt}
label-active-padding = 1

label-occupied = ●
label-occupied-padding = 1

label-urgent = ●
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1


[module/xwindow]
type = internal/xwindow
label = %title%


[module/mpd]
type = internal/mpd

; Host where mpd is running (either ip or domain name)
; Can also be the full path to a unix socket where mpd is running.
host = 127.0.0.1
port = 6600

interval = 1

format-online = <icon-prev>  <toggle>  <icon-next>  <bar-progress> <label-time>  <label-song>

label-song = 󰽰 %artist% - %title%
label-offline = 󰝚 mpd is offline

icon-play = 󰐊
icon-pause = 󰏤
icon-stop = 󰓛
icon-prev = 󰒮
icon-next = 󰒭
;icon-seekb = ⏪
;icon-seekf = ⏩
icon-consume = ✀

toggle-on-foreground = #ff
toggle-off-foreground = #55

; Only applies if <bar-progress> is used
bar-progress-width = 25
bar-progress-indicator = |
bar-progress-fill = ─
bar-progress-empty = ─


[module/date]
type = internal/date
interval = 1

time =  %H:%M
time-alt = %H:%M:%S
date = %a %d %b
date-alt = %Y-%m-%d

label = %time% | %date%
label-foreground = ${colors.foreground}


[module/timeDateWeather]
type = custom/script
exec = ~/.scripts/timeDateWeather.sh
interval = 60
label = %output%


[module/cpu]
type = internal/cpu
interval = 0.3
warn-percentage = 75

format = <label> <ramp-coreload>
format-warn = <label-warn>

label = CPU %percentage%%
label-warn = CPU %percentage%%

ramp-coreload-spacing = 1
ramp-coreload-0 = ▁
ramp-coreload-1 = ▂
ramp-coreload-2 = ▃
ramp-coreload-3 = ▄
ramp-coreload-4 = ▅
ramp-coreload-5 = ▆
ramp-coreload-6 = ▇
ramp-coreload-7 = █


[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>

label-muted =   muted
label-volume = %percentage%%
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

click-right = pavucontrol
; click-middle = 


[module/backlight]
type = internal/backlight

format = <ramp> <label>

label = %percentage%%

ramp-0 = 󱩎
ramp-1 = 󱩏
ramp-2 = 󱩐
ramp-3 = 󱩑
ramp-4 = 󱩒
ramp-5 = 󱩓
ramp-6 = 󱩔
ramp-7 = 󱩕
ramp-8 = 󱩖
ramp-9 = 󰛨


[module/wired-network]
type = internal/network


[module/wireless-network]
type = internal/network
interface-type = wireless
interval = 1.0

; Test connectivity every Nth update by pinging 8.8.8.8
; Default: 0
ping-interval = 3

; Accumulate values from all interfaces when querying for up/downspeed rate
; Default: false
accumulate-stats = true

format-connected = <label-connected>
;label-connected = %essid% %downspeed:9%
label-connected = %essid% | %downspeed%
format-disconnected = %{A1:networkmanager_dmenu:}󰖪 disconnected%{A}
format-disconnected-foreground = ${colors.disabled}


; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/tray]
type = internal/tray


[module/spotify]
type = custom/script
exec = playerctl metadata --player=spotify --format '  󰽰 {{ artist }} - {{ title }}'
interval = 2

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
