# WINDDOW RULES
rules = (
	# { match = "name = 'dwm'"; opacity = 1; },
    	{ match = "focused";              opacity = 1; },
    	{ match = "!focused";             opacity = 0.75; },
    	{ match = "tooltip";              fade = true; shadow = true; opacity = 0.5; focus = true; full-shadow = false; },
    	{ match = "popup_menu";           opacity = 0.7; },
    	{ match = "dropdown_menu";        opacity = 0.7; },
    	{ match = "class_g = 'Kitty'";    opacity = 0.7; },
    	{ match = "class_g = 'Spotify'";    opacity = 0.9; },
    	{ match = "class_g = 'discord'";    opacity = 0.9; },
    	{ match = "class_g = 'dolphin'";    opacity = 0.9; },
    	{ match = "class_g = 'systemsettings'";    opacity = 0.9; },
    	{ match = "class_g = 'Polybar'";  opacity = 0.7; },
    	{ match = "class_g = 'Dunst'";    opacity = 0.9; }
);


# OPACITY
#inactive-opacity = 0.8;
frame-opacity = 0.7;

# Let inactive opacity set by -i override the '_NET_WM_WINDOW_OPACITY' values of windows.
# inactive-opacity-override = true;

# if for some reason you want all windows transparent
# active-opacity = 1.0

# inactive-dim = 0.05

# fixed inactive dim value
# inactive-dim-fixed = 1.0

# focus-exclude = [ "class_g = 'dwm'" ];


# BLURRING
blur:
{
  method = "dual_kawase";
  size = 10;
  strength = 5;
  deviation = 1.0;
};

blur-background = true
blur-background-frame = true
blur-background-fixed = true


# SHADOWS
# shadow = true;
shadow-radius = 1; #blur radius
shadow-opacity = .1

shadow-offset-x = 0;
shadow-offset-y = 0;

# shadow-color = "#000000"
# shadow-exclude = [];


# FADING
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5


# OTHER SETTINGS
# dbus = true
# daemon = false

# backends: `xrender`, `glx`, `egl` or `xr_glx_hybrid`
backend = "egl";

dithered-present = false;

vsync = true;

# mark-wmwin-focused = true;

# mark-ovredir-focused = true;

detect-rounded-corners = false
detect-client-opacity = true;
use-ewmh-active-win = true
detect-transient = true;
# glx-no-stencil = true
use-damage = true;
log-level = "warn";


# picom -b to daemonize
