music_directory     "/home/gaitano/Music"
playlist_directory  "/home/gaitano/Music/playlists"
db_file            "/home/gaitano/.mpd/database"
log_file           "/home/gaitano/.mpd/log"
pid_file           "/home/gaitano/.mpd/pid"
state_file         "/home/gaitano/.mpd/state"
sticker_file       "/home/gaitano/.mpd/sticker.sql"
user              "gaitano"

auto_update         "yes"
bind_to_address    "127.0.0.1" # localhost
port               "6600"
restore_paused 		"yes"
max_output_buffer_size "2048" # in KB

audio_output {
	type 	  "pipewire"
	name 	  "Pipewire Output"	
}

decoder {
    plugin "wildmidi"
    config_file "/etc/wildmidi/wildmidi.cfg"
}

