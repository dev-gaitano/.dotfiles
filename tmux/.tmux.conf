# == BASE ==
# Start window and pane numbers at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on  # keep numbering sequential
set -g escape-time 0  # disable delays on escape sequences
set -g mouse on


# == LOOK & FEEL ==
# color
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# status bar
set-option -g status-style bg=default,fg=#808080,bright
set -gq allow-passthrough on
set -g status-justify left

# Left: user, session, branch
set -g status-left '#[default][ #(whoami) ] #[default][ #{session_name} ] #[default][ #(cd "#{pane_current_path}" 2>/dev/null && git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "no-repo") ] '
set -g status-left-length 100

# Right: battery, time, date
set -g status-right '#[fg=yellow][ #(nmcli -t -f active,ssid dev wifi | grep "^yes" | cut -d: -f2) ]#[default] \
#( \
  perc=$(upower -i $(upower -e | grep BAT) | awk "/percentage/ {gsub(/%/, \"\", \$2); print \$2}"); \
  state=$(upower -i $(upower -e | grep BAT) | awk "/state/ {print \$2}"); \
  if [ "$perc" -eq 100 ]; then \
    echo "#[fg=blue][ ${perc}% ]#[default]"; \
  elif [ "$state" = "charging" ]; then \
    echo "#[fg=green][ ${perc}% ]#[default]"; \
  elif [ "$perc" -lt 20 ]; then \
    echo "#[fg=red][ ${perc}% ]#[default]"; \
  else \
    echo "#[default][ ${perc}% ]"; \
  fi) \
#[default][ #(date +"%H:%Mh") ] \
[ #(date +%-d$(date +%e | awk "{d=\$1+0; print (d==1||d==21||d==31)?\"st\":(d==2||d==22)?\"nd\":(d==3||d==23)?\"rd\":\"th\"")\ %B\ %Y) ]'
set -g status-right-length 100

# Theme: status (windows)
set -g window-status-format "● #I"
set -g window-status-current-format "● #W"

set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=#a0028c,nobold}"
set -g window-status-bell-style "fg=red,nobold"


# == KEYBINDINGS ==
# Keybindings: windows
bind -n C-Tab next-window
bind -n C-S-Tab previous-window

# Keybindings: other
bind f resize-pane -Z
bind q detach-client
bind e choose-window -Z

# Keybindings: split
bind h split-window -h
bind | split-window -h
bind v split-window -v
bind - split-window -v

setw -g mode-keys vi
set -g visual-activity off

